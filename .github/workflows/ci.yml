name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx eslint .
      # NOTE: gitleaks-action now requires a paid license key for org repos,
      # so leak prevention relies on GitHub's free native protections instead:
      # enable Secret scanning + Push protection in repo Settings → Code security.
      - run: npx tsc --noEmit
      - run: npm run build

# Production is deployed directly from GitHub by Vercel (auto-deploy on push to
# main) — no staging environment here (ADR-005).
